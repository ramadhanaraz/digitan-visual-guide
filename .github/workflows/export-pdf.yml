name: Stamp Timestamp & Build PDF

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'

permissions:
  contents: write

concurrency:
  group: build-presentation-pdf
  cancel-in-progress: false

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Stamp Cover Timestamps & Export PDF
        run: |
          COMMIT_ISO=$(git log -1 --format=%cI)
          DISPLAY_TS=$(TZ='Asia/Jakarta' date -d "$COMMIT_ISO" +"%b %d, %Y · %H:%M WIB" | tr '[:lower:]' '[:upper:]')
          FILE_TS=$(TZ='Asia/Jakarta' date -d "$COMMIT_ISO" +"%Y%m%d-%H%MWIB")

          echo "Cover Stamp: LAST UPDATED: $DISPLAY_TS"
          echo "PDF Output:  exports/Digitan-Guide-${FILE_TS}.pdf"

          # 1. Update front and back cover timestamps in index.html
          DISPLAY_TS="$DISPLAY_TS" node -e '
            const fs = require("fs");
            const ts = process.env.DISPLAY_TS;
            let html = fs.readFileSync("index.html", "utf8");
            html = html.replace(/LAST UPDATED:[^<]*WIB/g, `LAST UPDATED: ${ts}`);
            fs.writeFileSync("index.html", html, "utf8");
          '

          # 2. Render exact 1280x720 PDF with updated cover timestamp
          mkdir -p exports
          rm -f exports/Digitan-Guide-*.pdf
          PDF_PATH="exports/Digitan-Guide-${FILE_TS}.pdf" node -e '
            const { chromium } = require("playwright");
            const path = require("path");
            (async () => {
              const browser = await chromium.launch();
              const page = await browser.newPage({ viewport: { width: 1280, height: 720 } });
              await page.goto("file://" + path.resolve("index.html"), { waitUntil: "networkidle" });
              await page.pdf({
                path: process.env.PDF_PATH,
                width: "1280px",
                height: "720px",
                printBackground: true,
                margin: { top: "0px", right: "0px", bottom: "0px", left: "0px" }
              });
              await browser.close();
            })();
          '

      - name: Commit stamped HTML and PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html exports/
          git diff --staged --quiet || git commit -m "chore: update cover timestamp and export PDF [skip ci]"
          git push
