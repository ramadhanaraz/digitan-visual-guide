name: Build Presentation PDF

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Render 1280x720 PDF
        run: |
          mkdir -p exports
          node -e '
            const { chromium } = require("playwright");
            const path = require("path");
            (async () => {
              const browser = await chromium.launch();
              const page = await browser.newPage({ viewport: { width: 1280, height: 720 } });
              await page.goto("file://" + path.resolve("index.html"), { waitUntil: "networkidle" });
              await page.pdf({
                path: "exports/Digitan-Guide.pdf",
                width: "1280px",
                height: "720px",
                printBackground: true,
                margin: { top: "0px", right: "0px", bottom: "0px", left: "0px" }
              });
              await browser.close();
            })();
          '

      - name: Commit updated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add exports/Digitan-Guide.pdf
          git diff --staged --quiet || git commit -m "chore: update exported PDF"
          git push
