name: Build Deck & Export PDF/PPTX

on:
  push:
    branches: [main]
    paths:
      - 'slides/**'
      - 'src/**'
      - 'assets/**'
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-presentation-artifacts
  cancel-in-progress: false

jobs:
  build-and-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright & Chromium
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps

      - name: Build index.html, Stamp Timestamps & Export PDF/PPTX
        run: |
          COMMIT_ISO=$(git log -1 --format=%cI)
          DISPLAY_TS=$(TZ='Asia/Jakarta' date -d "$COMMIT_ISO" +"%b %d, %Y · %H:%M WIB" | tr '[:lower:]' '[:upper:]')
          FILE_TS=$(TZ='Asia/Jakarta' date -d "$COMMIT_ISO" +"%Y%m%d-%H%MWIB")

          echo "Cover Stamp: LAST UPDATED: $DISPLAY_TS"
          echo "Artifact TS: $FILE_TS"

          # 1. Assemble unified index.html from slides/*.html, src/shell.html, and assets/*
          node scripts/build-deck.mjs

          # 2. Stamp front and back cover timestamps in assembled index.html
          DISPLAY_TS="$DISPLAY_TS" node -e '
            const fs = require("fs");
            const ts = process.env.DISPLAY_TS;
            let html = fs.readFileSync("index.html", "utf8");
            html = html.replace(/LAST UPDATED:[^<]*WIB/g, `LAST UPDATED: ${ts}`);
            fs.writeFileSync("index.html", html, "utf8");
          '

          # 3. Export PDF + Dark & Light PPTX via Playwright & HtmlSlideConverter over localhost
          FILE_TS="$FILE_TS" node scripts/export-artifacts.mjs

      - name: Commit Built Deck & Export Artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html exports/
          git diff --staged --quiet || git commit -m "chore: build deck and export PDF/PPTX artifacts"
          git push
